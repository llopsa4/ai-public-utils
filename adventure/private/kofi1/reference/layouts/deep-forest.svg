<text x="34" y="866" font-family="Georgia,serif" font-size="18" fill="#342a20">Kofi: 224 art px / 112 logical units. Background stays fixed; props and stages are independent.</text>
<text x="34" y="898" font-family="Georgia,serif" font-size="18" fill="#342a20">Click a stage to view one snapshot; All shows alternative footprints, not a simultaneous scene.</text>
<text x="34" y="940" font-family="Georgia,serif" font-size="17" fill="#342a20">warning: Tracks, torn brush, log, bound limb and intact vine visible.</text>
<text x="34" y="964" font-family="Georgia,serif" font-size="17" fill="#342a20">lane-clear: Vine cut; side limb moved to the rear side of the log. Return lane remains visibly empty.</text>
<text x="34" y="988" font-family="Georgia,serif" font-size="17" fill="#342a20">encounter: Bear enters after Huska is called back. Props retain cleared configuration.</text>
<text x="34" y="1012" font-family="Georgia,serif" font-size="17" fill="#342a20">aftermath-kill: Last shot hidden behind log; bear actor leaves visible stage. No visible blood, corpse sprite</text>
<text x="34" y="1036" font-family="Georgia,serif" font-size="17" fill="#342a20">or loot.</text>
<text x="34" y="1060" font-family="Georgia,serif" font-size="17" fill="#342a20">aftermath-release: Bear actor exits to cover while Kofi and Huska back along cleared lane. Same arrows</text>
<text x="34" y="1084" font-family="Georgia,serif" font-size="17" fill="#342a20">recovered.</text>
<script><![CDATA[function showStage(stage){document.querySelectorAll('[data-stages]').forEach(function(g){g.setAttribute('visibility',stage==='all'||g.getAttribute('data-stages').split(' ').indexOf(stage)>=0?'visible':'hidden')});document.querySelectorAll('[data-button]').forEach(function(g){var selected=g.getAttribute('data-button')===stage;g.querySelector('rect').setAttribute('fill',selected?'#dfcba8':'#fff9ee');g.setAttribute('aria-pressed',selected?'true':'false')})}]]></script></svg>