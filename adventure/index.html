<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#120d14">
  <title>Cinderfold</title>
  <script type="module" crossorigin src="./build/index-C4HkSf3z.js"></script>
  <link rel="stylesheet" crossorigin href="./build/index-O-xzH-Ao.css">
</head>
<body>
  <main id="app">
    <div id="stage">
      <div id="game"></div>
      <div id="overlay">
        <div id="hover" hidden></div>
        <div id="labels" hidden></div>
        <section id="dialogue" hidden>
          <div id="dialogue-portrait" aria-hidden="true"></div>
          <div class="dialogue-text">
            <p id="dialogue-name"></p>
            <p id="dialogue-line"></p>
            <p id="dialogue-more" data-i18n="ui.clickToContinue" hidden>Click to continue</p>
          </div>
        </section>
        <div id="radial" hidden></div>
        <div id="choices" role="group" hidden></div>
        <div id="toast" role="status" hidden></div>
      </div>
      <section id="end" hidden aria-labelledby="end-title">
        <p class="end-tag" data-i18n="ui.endTag">To be continued</p>
        <h2 id="end-title" data-i18n="ui.endTitle"></h2>
        <p data-i18n="ui.endText"></p>
        <button id="end-new" type="button" data-i18n="ui.newGame">New game</button>
      </section>
      <section id="title" hidden aria-labelledby="title-name">
        <h1 id="title-name" data-i18n="ui.titleName">Cinderfold</h1>
        <p class="title-sub" data-i18n="ui.endTitle">A delivery he does not want</p>
        <div class="title-actions">
          <button id="title-continue" type="button" data-i18n="ui.continue" hidden>Continue</button>
          <button id="title-new" type="button" data-i18n="ui.newGame">New game</button>
          <button id="title-import" type="button" data-i18n="ui.import">Import save</button>
          <button id="title-settings" type="button" data-i18n="ui.settings">Settings</button>
        </div>
        <p class="title-note" data-i18n="ui.notice"></p>
      </section>
      <p id="loading" data-i18n="ui.loading">Loading…</p>
    </div>
    <nav id="bar">
      <div id="inventory" role="toolbar" data-i18n-label="ui.inventory"></div>
      <div id="lang" role="group" data-i18n-label="ui.language"></div>
      <button id="mute-btn" type="button" data-i18n-label="ui.mute" aria-pressed="false">&#128264;</button>
      <button id="reveal-btn" type="button" data-i18n-label="ui.reveal" aria-pressed="false">&#128065;</button>
      <button id="fs-btn" type="button" data-i18n-label="ui.fullscreen" aria-pressed="false" hidden>&#x26F6;</button>
      <button id="notebook-btn" type="button" data-i18n="ui.notebook">Notebook</button>
      <button id="menu-btn" type="button" data-i18n="ui.menu">Menu</button>
    </nav>
  </main>

  <dialog id="menu">
    <h1 data-i18n="ui.title">Cinderfold</h1>
    <p data-i18n="ui.notice"></p>
    <p class="help" data-i18n="ui.help"></p>
    <div class="menu-actions">
      <button id="menu-export" type="button" data-i18n="ui.export">Export save</button>
      <button id="menu-import" type="button" data-i18n="ui.import">Import save</button>
      <button id="menu-new" type="button" data-i18n="ui.newGame">New game</button>
      <button id="menu-history" type="button" data-i18n="ui.history">History</button>
      <button id="menu-settings" type="button" data-i18n="ui.settings">Settings</button>
      <button id="menu-title" type="button" data-i18n="ui.toTitle">Title screen</button>
      <button id="menu-close" type="button" data-i18n="ui.close">Close</button>
    </div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </dialog>

  <dialog id="notebook">
    <h1 data-i18n="ui.notebookTitle">Mara's notebook</h1>
    <ol id="objectives"></ol>
    <p id="secrets" class="secrets" hidden></p>
    <div id="hint-box">
      <p id="hint-text" class="hint" hidden></p>
      <button id="hint-btn" type="button" data-i18n="ui.hint">Hint</button>
    </div>
    <div class="menu-actions"><button type="button" class="dialog-close" data-i18n="ui.close">Close</button></div>
  </dialog>

  <dialog id="history">
    <h1 data-i18n="ui.historyTitle">What was said</h1>
    <ol id="history-list"></ol>
    <div class="menu-actions"><button type="button" class="dialog-close" data-i18n="ui.close">Close</button></div>
  </dialog>

  <dialog id="settings">
    <h1 data-i18n="ui.settings">Settings</h1>
    <form id="settings-form" class="settings">
      <label><span data-i18n="ui.textSpeed">Text speed</span>
        <select name="textSpeed">
          <option value="slow" data-i18n="ui.speed.slow">Slow</option>
          <option value="normal" data-i18n="ui.speed.normal">Normal</option>
          <option value="fast" data-i18n="ui.speed.fast">Fast</option>
        </select>
      </label>
      <label><span data-i18n="ui.volume">Effects volume</span><input name="volume" type="range" min="0" max="1" step="0.05"></label>
      <label><span data-i18n="ui.musicVolume">Music volume</span><input name="musicVolume" type="range" min="0" max="1" step="0.05"></label>
      <label class="check"><input name="muted" type="checkbox"><span data-i18n="ui.mute">Mute</span></label>
      <label class="check"><input name="autoAdvance" type="checkbox"><span data-i18n="ui.autoAdvance">Advance lines automatically</span></label>
      <label class="check"><input name="reducedMotion" type="checkbox"><span data-i18n="ui.reducedMotion">Reduce motion</span></label>
      <label><span data-i18n="ui.textSize">Text size</span>
        <select name="textSize">
          <option value="s" data-i18n="ui.size.s">Small</option>
          <option value="m" data-i18n="ui.size.m">Medium</option>
          <option value="l" data-i18n="ui.size.l">Large</option>
        </select>
      </label>
      <label><span data-i18n="ui.quality">Visual quality</span>
        <select name="visualQuality">
          <option value="high" data-i18n="ui.quality.high">High</option>
          <option value="low" data-i18n="ui.quality.low">Low</option>
        </select>
      </label>
      <label class="check"><input name="highContrast" type="checkbox"><span data-i18n="ui.highContrast">High-contrast text panels</span></label>
    </form>
    <div class="menu-actions"><button type="button" class="dialog-close" data-i18n="ui.close">Close</button></div>
  </dialog>

  <div id="rotate" data-i18n="ui.rotate">Turn your device sideways to play.</div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</body>
</html>
