<text x="34" y="866" font-family="Georgia,serif" font-size="18" fill="#342a20">Silas: 220 art px / 110 logical units. Background stays fixed; props and stages are independent.</text>
<text x="34" y="898" font-family="Georgia,serif" font-size="18" fill="#342a20">Click a stage to view one snapshot; All shows alternative footprints, not a simultaneous scene.</text>
<text x="34" y="940" font-family="Georgia,serif" font-size="17" fill="#342a20">reference: All implemented conditional placements; each target and sprite lists its own flag conditions.</text>
<script><![CDATA[function showStage(stage){document.querySelectorAll('[data-stages]').forEach(function(g){g.setAttribute('visibility',stage==='all'||g.getAttribute('data-stages').split(' ').indexOf(stage)>=0?'visible':'hidden')});document.querySelectorAll('[data-button]').forEach(function(g){var selected=g.getAttribute('data-button')===stage;g.querySelector('rect').setAttribute('fill',selected?'#dfcba8':'#fff9ee');g.setAttribute('aria-pressed',selected?'true':'false')})}]]></script></svg>