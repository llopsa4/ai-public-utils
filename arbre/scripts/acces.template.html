<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' @@SCRIPT_HASHES@@; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src blob:; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Arbre familiar · Accés protegit</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./acces.css">
  <script src="./acces.js" defer></script>
</head>
<body>
  <main id="login" class="login">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Arxiu familiar</p>
      <h1 id="title">L’arbre de la família</h1>
      <p class="intro">Un espai per descobrir les nostres arrels.</p>
      <form id="unlock">
        <label for="password">Contrasenya</label>
        <div class="password-row"><input id="password" type="password" autocomplete="current-password" required spellcheck="false" aria-describedby="message"><button id="toggle" type="button" aria-pressed="false">Mostrar</button></div>
        <button id="submit" class="primary" type="submit">Veure l’arbre</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <p class="fine">Accés de consulta. Les dades es desxifren només en aquest navegador.</p>
      <a class="back" href="../">Tornar a l’inici</a>
    </section>
  </main>
  <section id="viewer" class="viewer" hidden aria-label="Arbre familiar de consulta">
    <div class="viewer-bar"><span>Arbre familiar <small>Només consulta</small></span><button id="lock" type="button">Tancar l’arbre</button></div>
    <iframe id="tree" title="Arbre genealògic de consulta" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </section>
  <noscript>Cal activar JavaScript per desxifrar i consultar l’arbre.</noscript>
</body>
</html>
