<text x="34" y="866" font-family="Georgia,serif" font-size="18" fill="#342a20">Kofi: 224 art px / 112 logical units. Background stays fixed; props and stages are independent.</text>
<text x="34" y="898" font-family="Georgia,serif" font-size="18" fill="#342a20">Click a stage to view one snapshot; All shows alternative footprints, not a simultaneous scene.</text>
<text x="34" y="940" font-family="Georgia,serif" font-size="17" fill="#342a20">arrival: The quiet bow exchange introduces Deyu’s folding bow, hunting points, reusable wooden blunt arrow</text>
<text x="34" y="964" font-family="Georgia,serif" font-size="17" fill="#342a20">and cord-carrying arrows. The fire stick starts caught in a separate dead bough; only the chosen human</text>
<text x="34" y="988" font-family="Georgia,serif" font-size="17" fill="#342a20">survivor is present.</text>
<text x="34" y="1012" font-family="Georgia,serif" font-size="17" fill="#342a20">stick-down: The blunt arrow has knocked down the loose fire stick and been recovered. The stick lies</text>
<text x="34" y="1036" font-family="Georgia,serif" font-size="17" fill="#342a20">separately on clean ground until taken; the bare dead bough stays in place.</text>
<text x="34" y="1060" font-family="Georgia,serif" font-size="17" fill="#342a20">prepared: Branch removed from ground and lit in Kofi’s hand; goats gathered inside the light. Both</text>
<text x="34" y="1084" font-family="Georgia,serif" font-size="17" fill="#342a20">preparations required for encounter.</text>
<text x="34" y="1108" font-family="Georgia,serif" font-size="17" fill="#342a20">aftermath: Wolf pack has fled; the last wolf is an actor at the right. Kill occurs out of view, or the actor</text>
<text x="34" y="1132" font-family="Georgia,serif" font-size="17" fill="#342a20">exits. No trophy or carcass prop.</text>
<text x="34" y="1156" font-family="Georgia,serif" font-size="17" fill="#342a20">dawn: Same objects and actor identities; runtime lighting changes. Packing hides them only as their carriers</text>
<text x="34" y="1180" font-family="Georgia,serif" font-size="17" fill="#342a20">leave.</text>
<script><![CDATA[function showStage(stage){document.querySelectorAll('[data-stages]').forEach(function(g){g.setAttribute('visibility',stage==='all'||g.getAttribute('data-stages').split(' ').indexOf(stage)>=0?'visible':'hidden')});document.querySelectorAll('[data-button]').forEach(function(g){var selected=g.getAttribute('data-button')===stage;g.querySelector('rect').setAttribute('fill',selected?'#dfcba8':'#fff9ee');g.setAttribute('aria-pressed',selected?'true':'false')})}]]></script></svg>