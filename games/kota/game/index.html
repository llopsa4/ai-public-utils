<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kota">
<title>Kota</title>
<style>
  :root { --ui: rgba(232, 196, 148, 0.16); --ui-edge: rgba(236, 206, 160, 0.6); --ink: #fff4e1;
    --gold: #f2d9a8; --rust: #b5532f; --blue: #3f6f93; --bone: #efe4cc; --hide: rgba(70, 48, 32, 0.78); }
  /* The bands on menus (#screen::before and ::after) are plain blue, white and rust shapes: invented, they copy no real beadwork. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a16; color: var(--ink);
    font: 14px/1.3 system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; width: 100% !important; height: 100% !important; }
  /* Light over the arena: a dawn or dusk wash and a vignette (atmosphere.js shows it; "light" quality does not). */
  #light { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 0; }
  #light.dawn { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(10,6,12,0.55) 100%),
    linear-gradient(180deg, rgba(255,150,90,0.17) 0%, rgba(255,190,130,0.05) 45%, rgba(40,30,60,0.1) 100%); }
  #light.dusk { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(8,6,16,0.6) 100%),
    linear-gradient(180deg, rgba(110,80,150,0.2) 0%, rgba(0,0,0,0) 50%, rgba(255,130,60,0.1) 100%); }
  #hud { position: fixed; bottom: max(4px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-size: 11px; opacity: 0.6; pointer-events: none; }
  .stick-base, .stick-knob { position: fixed; border-radius: 50%; pointer-events: none; display: none; }
  .stick-base { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: var(--ui); border: 2px solid var(--ui-edge); }
  .stick-knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; background: var(--ui-edge); }
  #buttons { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right));
    width: 190px; height: 110px; touch-action: none; display: none; }
  #buttons.left { right: auto; left: max(16px, env(safe-area-inset-left)); }
  .btn { position: absolute; border-radius: 50%; background: var(--ui); border: 2px solid var(--ui-edge);
    color: var(--ink); display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 12px; touch-action: none; }
  .btn.down { background: var(--ui-edge); }
  .btn[data-act="ability"] { width: 88px; height: 88px; right: 0; bottom: 0; }
  .btn[data-act="dash"] { width: 64px; height: 64px; right: 104px; bottom: 0; }
  #buttons.left .btn { right: auto; }
  #buttons.left .btn[data-act="ability"] { left: 0; }
  #buttons.left .btn[data-act="dash"] { left: 104px; }
  #settings-btn { z-index: 6; position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    background: var(--hide); color: var(--ink); border: 1px solid var(--ui-edge); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  #hp { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); width: 160px; height: 16px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--ui-edge); border-radius: 8px; overflow: hidden; pointer-events: none; display: none; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #d4573a, #9a3a2a); }
  #hp-text { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 15px; }
  #exp { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 20px); left: max(8px, env(safe-area-inset-left)); width: 160px; height: 12px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--ui-edge); border-radius: 6px; overflow: hidden; pointer-events: none; display: none; }
  #exp-fill { height: 100%; width: 0; background: linear-gradient(180deg, #f0c25a, #c08a2c); }
  #exp-text { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 11px; }
  #embers { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 38px); left: max(8px, env(safe-area-inset-left));
    font-size: 12px; pointer-events: none; display: none; text-shadow: 0 1px 2px #000; }
  #wave-label { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    font-size: 13px; opacity: 0.9; pointer-events: none; display: none; text-shadow: 0 1px 2px #000; }
  #boss { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 22px); left: 50%; transform: translateX(-50%); width: min(280px, 36vw);
    pointer-events: none; display: none; text-align: center; font-size: 11px; text-shadow: 0 1px 2px #000; }
  #boss-bar { height: 10px; margin-top: 2px; background: rgba(0,0,0,0.55); border: 1px solid var(--ui-edge); border-radius: 5px; overflow: hidden; }
  #boss-fill { height: 100%; width: 100%; background: linear-gradient(180deg, #b8452f, #7a2a1e); }
  body.in-run.boss #boss { display: block; }
  body.in-run #hp, body.in-run #exp, body.in-run #embers, body.in-run #wave-label, body.in-run #buttons { display: block; }
  #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 7; display: none; align-items: center; gap: 10px;
    max-width: max(220px, min(420px, calc(100vw - 440px))); padding: 8px 12px; background: var(--hide); border: 1px solid var(--ui-edge); border-radius: 8px;
    font-size: 13px; text-align: center; pointer-events: none; }
  #hint-skip { pointer-events: auto; flex: none; background: transparent; color: var(--ink); border: 1px solid var(--ui-edge); border-radius: 6px;
    padding: 4px 8px; font-size: 11px; }
  #banner { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 7; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 0.4s; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  #banner.show { opacity: 1; }
  #banner-title { font-size: 24px; font-weight: 700; }
  #banner-sub { font-size: 13px; opacity: 0.9; }
  #screen { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: radial-gradient(ellipse at center, rgba(44,30,20,0.78) 0%, rgba(18,13,10,0.9) 100%); padding: 16px; text-align: center; overflow-y: auto; overscroll-behavior: contain;
    justify-content: safe center; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  #screen::before, #screen::after { content: ''; position: fixed; left: 0; right: 0; height: 13px; pointer-events: none; z-index: 1; }
  #screen::before { top: 0; }
  #screen::before, #screen::after { background:
      conic-gradient(from -45deg at 50% 100%, var(--rust) 0 90deg, transparent 0) 0 0 / 20px 10px repeat-x,
      conic-gradient(from 135deg at 50% 0, var(--blue) 0 90deg, transparent 0) 10px 0 / 20px 10px repeat-x,
      linear-gradient(90deg, var(--bone) 0 50%, var(--rust) 0) 0 10px / 10px 3px repeat-x; }
  #screen::after { bottom: 0; transform: scaleY(-1); }
  body.camp #screen { background: linear-gradient(180deg, rgba(12,9,7,0.55) 0%, rgba(12,9,7,0.25) 60%, rgba(12,9,7,0) 100%); justify-content: safe flex-start; padding-top: max(28px, env(safe-area-inset-top)); }
  #screen > * { flex: none; }
  #screen-panel { flex: 0 1 auto !important; min-height: 0; }
  #screen h1 { margin: 0; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); text-shadow: 0 2px 4px #000; }
  #screen-body { max-width: 460px; opacity: 0.85; white-space: pre-line; }
  #screen-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .opt { display: flex; flex-direction: column; gap: 4px; min-width: 150px; max-width: 220px; min-height: 48px; padding: 10px 14px;
    background: linear-gradient(180deg, rgba(150,104,66,0.55), var(--hide)); color: var(--ink); border: 2px solid var(--ui-edge);
    border-radius: 8px; font: inherit; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,236,200,0.25); }
  .opt span { font-size: 12px; opacity: 0.85; white-space: pre-line; }
  .opt:active { background: var(--ui-edge); transform: translateY(1px); box-shadow: none; }
  .opt:disabled { opacity: 0.45; }
  #screen-panel { display: none; width: 100%; max-height: 100%; justify-content: center; }
  .shop { width: min(840px, 100%); max-height: 100%; overflow-y: auto; display: grid; grid-template-columns: 1fr 176px;
    gap: 6px 10px; text-align: left; align-items: start; }
  .shop-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-right: 72px; }   /* clear of the Settings button */
  .shop-head h1 { font-size: 16px; flex: 1 1 auto; }
  .shop-head .embers { font-size: 14px; color: #f2b84a; }
  .shop-head .opt { min-width: 0; min-height: 48px; padding: 6px 12px; flex-direction: row; }
  .note { min-height: 16px; font-size: 12px; color: #f2b84a; }
  .offers, .mine-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mine-row { grid-template-columns: repeat(6, 1fr); }
  .shop-main { min-width: 0; }
  .card { display: flex; flex-direction: column; gap: 2px; padding: 6px; background: linear-gradient(180deg, rgba(150,104,66,0.4), var(--hide)); border: 1px solid var(--ui-edge);
    border-radius: 8px; min-width: 0; border-top: 3px solid var(--rust); }
  .card.weapon { border-top-color: var(--blue); }
  .card.mine { border-top-color: var(--bone); }
  .card.locked { border-color: #f2b84a; }
  .card.empty { justify-content: center; align-items: center; min-height: 96px; opacity: 0.5; }
  .card-name { font-weight: 700; font-size: 12px; }
  .card-sub { font-size: 11px; opacity: 0.75; text-transform: capitalize; }
  .card-text { font-size: 11px; white-space: pre-line; flex: 1; }
  .card .row { display: flex; gap: 4px; margin-top: 4px; }
  .card button { flex: 1; min-height: 48px; background: var(--ui); color: var(--ink); border: 1px solid var(--ui-edge);
    border-radius: 6px; font: inherit; font-size: 11px; padding: 2px; }
  .card button.buy { background: rgba(217, 164, 65, 0.35); font-weight: 700; }
  .card button.armed { background: #b8452f; }
  .card button:disabled { opacity: 0.4; }
  .stats { font-size: 11px; background: rgba(30,20,14,0.5); border: 1px solid var(--ui-edge); border-radius: 8px; padding: 6px; }
  .stats-title { font-weight: 700; margin: 2px 0; color: var(--gold); }
  .stat { display: flex; justify-content: space-between; }
  .stat.zero { opacity: 0.5; }
  .carried { font-size: 10px; opacity: 0.85; }
  @media (max-width: 700px) { .shop { grid-template-columns: 1fr; } .offers { grid-template-columns: repeat(2, 1fr); } .mine-row { grid-template-columns: repeat(3, 1fr); } }
  /* Short landscape screens (phones): tighter menus so every option fits or scrolls instead of overlapping. */
  @media (max-height: 480px) {
    #screen { gap: 6px; padding: 15px 12px; padding-top: max(15px, env(safe-area-inset-top)); padding-bottom: max(15px, env(safe-area-inset-bottom)); }   /* clear of the 13 px bands */
    #screen h1 { font-size: 18px; }
    #screen-body { font-size: 12px; max-width: 640px; }
    #screen-actions { gap: 6px; }
    .opt { min-width: 120px; min-height: 48px; padding: 6px 10px; gap: 2px; }
    .opt span { font-size: 11px; }
    .card-text { font-size: 10px; }
  }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: #1d1a16; font-size: 18px; padding: 24px; z-index: 10; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="light"></div>
<div id="hud"></div>
<div id="hp"><div id="hp-fill"></div><div id="hp-text"></div></div>
<div id="exp"><div id="exp-fill"></div><div id="exp-text"></div></div>
<div id="embers"></div>
<div id="wave-label"></div>
<div id="boss"><div id="boss-name"></div><div id="boss-bar"><div id="boss-fill"></div></div></div>
<div id="hint"><span id="hint-text"></span><button id="hint-skip" type="button">Skip hints</button></div>
<div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
<div class="stick-base"></div><div class="stick-knob"></div>
<div id="buttons">
  <div class="btn" data-act="dash">Dash</div>
  <div class="btn" data-act="ability">Ability</div>
</div>
<button id="settings-btn" type="button">Settings</button>
<div id="screen"><h1 id="screen-title"></h1><div id="screen-body"></div><div id="screen-actions"></div><div id="screen-panel"></div></div>
<div id="rotate">Turn your device sideways to play.</div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
